name: Automated Video Uploader Pipeline

on:
  # 1. Automated Schedule (Cron Job) - Har 2 ghante me chalega
  schedule:
    - cron: '0 */2 * * *'
  
  # 2. Manual Trigger (GitHub par 'Run workflow' button dabakar)
  workflow_dispatch:

jobs:
  upload-job:
    runs-on: ubuntu-latest

    steps:
      # Code Checkout
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # Dependencies Install
      - name: Install Dependencies
        run: npm ci

      # Environment Setup (Secrets se files banana)
      - name: Inject Credentials & Config
        env:
          DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node setup-env.js

      # Main Uploader Script Execution
      - name: Run Auto Uploader
        run: node index.js

      # Sync updated db.json back to Repository
      - name: Commit & Push Updated db.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update db.json state" && git push)