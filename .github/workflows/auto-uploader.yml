name: Automated Video Uploader Pipeline

on:
  # Har 2 ghante me automatically chalega
  schedule:
    - cron: '0 */2 * * *'

  # GitHub Actions se manually run karne ke liye
  workflow_dispatch:

jobs:
  upload-job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Repository Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Google Drive credentials GitHub Secrets se
      # Facebook Page ID + Token testing ke liye hardcoded
      - name: Inject Credentials & Config
        env:
          DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          # Facebook - TEST ONLY
          FB_PAGE_ID: "948950664962578"
          FB_PAGE_ACCESS_TOKEN: "YOUR_FB_PAGE_ACCESS_TOKEN"

        run: node setup-env.js

      # 5. Run Auto Uploader
      - name: Run Auto Uploader
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          # Facebook - TEST ONLY
          FB_PAGE_ID: "948950664962578"
          FB_PAGE_ACCESS_TOKEN: "YOUR_FB_PAGE_ACCESS_TOKEN"

        run: node index.js

      # 6. Updated db.json repository me save karo
      - name: Commit & Push Updated db.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add db.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update db.json state"
            git push
          else
            echo "No db.json changes to commit."
          fi