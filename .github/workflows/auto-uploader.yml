name: Automated Video Uploader Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'

  workflow_dispatch:

jobs:
  upload-job:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Hardcoded Environment Variables (TEST ONLY)
      - name: Set Environment Variables
        run: |
          echo "DRIVE_FOLDER_ID=1WSbvB0off9kd3GK3w6PlDKLID4uMGblK" >> $GITHUB_ENV
          echo "FB_PAGE_ID=948950664962578" >> $GITHUB_ENV
          echo "FB_PAGE_ACCESS_TOKEN=EAAWZAtujj3kABSMvLE9KdEQsKZAvdFhXLOay5WPSfMZAsv6bnhojH2gWaZCKYe5eZAVcNQ8ZAmuYnCDgpviZCdLZBGYlZCA6ykHpAtGuAuYqPUKVljwNCSh3PBLvgtyemsw9jwdCvAThlDZCRkAeZAXLCvxuZCh6iFBzgOKCBB6LMNaZAOSZAKMTGJwGeuawj4Dw90" >> $GITHUB_ENV

      # Optional: Create Google Drive Files
      - name: Create Google Drive Credentials
        run: |
          mkdir -p drive
          cat <<EOF > drive/credentials.json
          YOUR_CREDENTIALS_JSON
          EOF

          cat <<EOF > drive/token.json
          YOUR_TOKEN_JSON
          EOF

      # Run Project
      - name: Run Auto Uploader
        run: node index.js

      # Commit db.json
      - name: Commit & Push Updated db.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add db.json

          git diff --cached --quiet || (
            git commit -m "chore: auto-update db.json state"
            git push
          )